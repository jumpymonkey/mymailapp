<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyMailApp{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">&#9993;</span>
        <span>MyMailApp</span>
        <span class="badge-readonly">Read-Only</span>
      </a>
      {% if user_email is defined and user_email %}
      <div class="account-bar">
        <span class="account-email" title="Authenticated Gmail account">{{ user_email }}</span>
        <form action="/auth/logout" method="post" class="inline-form">
          <button type="submit" class="btn btn-secondary btn-sm">Sign Out &amp; Revoke</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
